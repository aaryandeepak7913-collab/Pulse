<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00070d">
<title>Holo-Lock</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--c:#00e5ff;--bg:#00070d;--ok:#7dffb2;--bad:#ff3b5c}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Orbitron","Trebuchet MS",sans-serif;color:var(--c)}
#v{display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.32;filter:grayscale(1) sepia(1) hue-rotate(150deg) saturate(3)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,229,255,.05) 0 1px,transparent 1px 3px)}
#ui{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px 0;text-align:center;pointer-events:none;z-index:2}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.4em;text-shadow:0 0 12px var(--c);animation:gl 5s infinite}
#msg{margin-top:14px;font-size:14px;font-weight:500;letter-spacing:.12em;text-shadow:0 0 10px currentColor}
#sub{margin-top:8px;font-size:11px;letter-spacing:.08em;opacity:.7}
#bot{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;z-index:2}
#live{font-size:12px;letter-spacing:.14em;min-height:16px;text-shadow:0 0 8px var(--c)}
#chips{font-size:13px;letter-spacing:.1em;min-height:20px;margin:8px 0 14px;color:#fff;text-shadow:0 0 8px var(--c)}
button{display:none;font:inherit;font-size:11px;letter-spacing:.1em;color:var(--c);background:rgba(0,229,255,.08);border:1px solid var(--c);padding:11px 16px;margin:4px;cursor:pointer;box-shadow:0 0 12px rgba(0,229,255,.35)}
button:active{background:rgba(0,229,255,.25)}
@keyframes gl{0%,92%,100%{transform:none}93%{transform:translateX(-3px);text-shadow:3px 0 #ff3b5c,-3px 0 #00e5ff}95%{transform:translateX(3px)}97%{transform:none}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div id="ui"><h1>HOLO-LOCK</h1><div id="msg"></div><div id="sub"></div></div>
<div id="bot"><div id="live"></div><div id="chips"></div>
<button id="sv">SAVE SEQUENCE</button><button id="cl">CLEAR</button><button id="rst">RESET ALL</button><button id="lk">LOCK AGAIN</button></div>
<script type="module">
import {FilesetResolver,HandLandmarker,FaceLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const CDN="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14",MD="https://storage.googleapis.com/mediapipe-models/";
const TH=0.15; // face match limit: lower = stricter. Live score is shown on screen so you can tune it.
const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d'),v=$('v');
let W,H,D=devicePixelRatio||1,t=0,last=0;
function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',rs);rs();
let st='boot',face=null,seq=null,hd,fl,vReady=false,lastVT=-1,fr=null,hr=null,samples=[],sampT=0,holdT=0,gSeq=[],cur='',lastG='',armed=true,gT=0,flash=0,flashCol='#ff3b5c',grantT=0,score=null;
try{face=JSON.parse(localStorage.getItem('hf'));seq=JSON.parse(localStorage.getItem('hs'))}catch(e){}
const P=[...Array(45)].map(()=>({x:Math.random(),y:Math.random(),v:.01+Math.random()*.03,r:.5+Math.random()*1.5}));
const say=(m,s,col)=>{$('msg').textContent=m;$('sub').textContent=s||'';$('msg').style.color=col||''};
const show=(id,on)=>$(id).style.display=on?'inline-block':'none';
const GN={'00000':'FIST','11111':'PALM','01000':'ONE','01100':'PEACE','01110':'THREE','01111':'FOUR','10000':'THUMB','01001':'ROCK','10001':'SHAKA','11000':'GUN','00001':'PINKY','00100':'MIDDLE'};
const HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function chips(){
  if(st==='setg')$('chips').textContent=gSeq.map(g=>GN[g]||g).join('  >  ');
  else if(st==='hand')$('chips').textContent='●'.repeat(gSeq.length)+'○'.repeat(Math.max(0,seq.length-gSeq.length));
  else $('chips').textContent='';
  show('sv',st==='setg'&&gSeq.length>=3);
}
function enter(s){
  st=s;holdT=0;gT=0;cur='';lastG='';armed=true;samples=[];score=null;$('live').textContent='';
  if(s==='setg'||s==='hand')gSeq=[];
  const M={enroll:['ENROLL YOUR FACE','LOOK STRAIGHT AT THE CAMERA'],face:['FACE SCAN','LOOK AT THE CAMERA'],setg:['SET YOUR HAND SEQUENCE','SHOW 3 TO 6 SIGNS. HOLD EACH ONE STEADY.'],hand:['SHOW YOUR HAND SEQUENCE','HOLD EACH SIGN STEADY']}[s];
  if(M)say(M[0],M[1]);
  show('cl',s==='setg');show('rst',s==='face'||s==='hand');show('lk',s==='granted');chips();
}
function fail(m,s){flash=1;flashCol='#ff3b5c';say(m,s,'var(--bad)');gSeq=[];chips();const k=st;setTimeout(()=>{if(st===k)enter(k)},1100)}
function grant(){st='granted';grantT=0;flash=1;flashCol='#7dffb2';say('ACCESS GRANTED','WELCOME BACK. ALL SYSTEMS ONLINE','var(--ok)');$('live').textContent='';$('chips').textContent='';show('rst',0);show('sv',0);show('cl',0);show('lk',1)}

// ---- face signature: normalized landmark geometry ----
function norm(L){
  const n=L.length,vw=v.videoWidth,vh=v.videoHeight,p=L.map(l=>[l.x*vw,l.y*vh,l.z*vw]);
  let cx=0,cy=0,cz=0;p.forEach(q=>{cx+=q[0];cy+=q[1];cz+=q[2]});cx/=n;cy/=n;cz/=n;
  const a=Math.atan2(p[263][1]-p[33][1],p[263][0]-p[33][0]),co=Math.cos(-a),si=Math.sin(-a);let s=0;
  const o=p.map(q=>{const X=q[0]-cx,Y=q[1]-cy,Z=q[2]-cz,r=[X*co-Y*si,X*si+Y*co,Z];s+=r[0]*r[0]+r[1]*r[1]+r[2]*r[2];return r});
  s=Math.sqrt(s/n);return o.flat().map(u=>u/s);
}
const dist=(a,b)=>{let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s/(a.length/3))};

// ---- hand sign: which of the 5 fingers are extended ----
function sign(L){
  const w=v.videoWidth,h=v.videoHeight,d=(a,b)=>Math.hypot((L[a].x-L[b].x)*w,(L[a].y-L[b].y)*h,(L[a].z-L[b].z)*w);
  const f=[d(4,17)>d(3,17)*1.08?1:0];
  [[8,6],[12,10],[16,14],[20,18]].forEach(q=>f.push(d(q[0],0)>d(q[1],0)*1.12?1:0));
  return f.join('');
}

function detect(ts){
  if(st==='enroll'||st==='face'){const r=fl.detectForVideo(v,ts);fr=r.faceLandmarks[0]||null;hr=null}
  else{const r=hd.detectForVideo(v,ts);hr=r.landmarks[0]||null;fr=null}
}
function logic(dt){
  if(st==='enroll'){
    if(fr){sampT+=dt;if(sampT>.1){sampT=0;samples.push(norm(fr))}}
    if(samples.length>=25){
      const n=samples[0].length,m=new Array(n).fill(0);samples.forEach(s=>s.forEach((u,i)=>m[i]+=u/samples.length));
      face=m.map(u=>+u.toFixed(4));try{localStorage.setItem('hf',JSON.stringify(face))}catch(e){}
      flash=1;flashCol='#7dffb2';enter(seq?'face':'setg');
    }
  }else if(st==='face'){
    if(fr){const d=dist(norm(fr),face);score=d;
      if(d<TH)holdT+=dt;else holdT=Math.max(0,holdT-dt);
      $('live').textContent='MATCH SCORE '+d.toFixed(3)+' (NEEDS UNDER '+TH+')';
      if(holdT>=1){flash=1;flashCol='#7dffb2';enter(seq?'hand':'setg')}
    }else{holdT=0;score=null;$('live').textContent='NO FACE FOUND'}
  }else if(st==='setg'||st==='hand'){
    const g=hr?sign(hr):null;
    $('live').textContent=g?'DETECTED: '+(GN[g]||g):'SHOW YOUR HAND';
    if(g!==cur){cur=g;gT=0;if(g!==lastG)armed=true}
    else if(g&&armed){
      gT+=dt;
      if(gT>=.9){
        armed=false;lastG=g;gT=0;gSeq.push(g);
        if(st==='setg'){if(gSeq.length>=6){saveSeq()}else chips()}
        else{
          const k=gSeq.length-1;
          if(gSeq[k]!==seq[k])fail('ACCESS DENIED','WRONG SEQUENCE. TRY AGAIN.');
          else if(gSeq.length===seq.length)grant();else chips();
        }
      }
    }
  }
}
function saveSeq(){seq=gSeq.slice();try{localStorage.setItem('hs',JSON.stringify(seq))}catch(e){}flash=1;flashCol='#7dffb2';enter('hand');say('SEQUENCE SAVED','NOW SHOW IT AGAIN TO UNLOCK','var(--ok)')}

// ---- setup ----
async function boot(){
  try{
    say('STARTING CAMERA','ALLOW ACCESS WHEN ASKED');
    v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
    await v.play();v.style.display='block';
    say('LOADING NEURAL MODELS','FIRST LOAD TAKES A MOMENT');
    const fs=await FilesetResolver.forVisionTasks(CDN+'/wasm');
    const mk=async(C,url,o)=>{for(const d of['GPU','CPU']){try{return await C.createFromOptions(fs,{baseOptions:{modelAssetPath:url,delegate:d},runningMode:'VIDEO',...o})}catch(e){}}throw Error('Model load failed')};
    hd=await mk(HandLandmarker,MD+'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',{numHands:1});
    fl=await mk(FaceLandmarker,MD+'face_landmarker/face_landmarker/float16/1/face_landmarker.task',{numFaces:1});
    vReady=true;enter(face?'face':'enroll');
  }catch(e){st='boot';say('START FAILED',((e&&(e.message||e.name))||'ERROR')+'. NEEDS HTTPS AND CAMERA. TAP TO RETRY.','var(--bad)')}
}
c.addEventListener('pointerdown',()=>{if(st==='boot'){st='load';boot()}});
$('sv').onclick=saveSeq;$('cl').onclick=()=>{gSeq=[];chips()};
$('lk').onclick=()=>enter('face');
$('rst').onclick=()=>{face=null;seq=null;try{localStorage.removeItem('hf');localStorage.removeItem('hs')}catch(e){}enter('enroll')};

// ---- drawing ----
function map(l){const vw=v.videoWidth,vh=v.videoHeight,s=Math.max(W/vw,H/vh);return[W-(l.x*vw*s+(W-vw*s)/2),l.y*vh*s+(H-vh*s)/2]}
function ring(cx,cy,r,w,dash,spd){x.save();x.translate(cx,cy);x.rotate(t*spd);x.setLineDash(dash);x.lineWidth=w;x.beginPath();x.arc(0,0,r,0,7);x.stroke();x.restore()}
function loop(ts){
  const dt=Math.min((ts-last)/1000||0,.05);last=ts;t=ts/1000;
  if(vReady&&v.currentTime!==lastVT&&st!=='granted'&&st!=='boot'){lastVT=v.currentTime;try{detect(ts);logic(dt)}catch(e){}}
  x.clearRect(0,0,W,H);
  const cx=W/2,cy=H*.5,R=Math.min(W,H)*.3,ok=st==='granted',col=ok?'#7dffb2':'#00e5ff',f=(st==='load'||st==='enroll')?3:1;
  x.fillStyle='rgba(0,229,255,.5)';
  P.forEach(p=>{p.y-=p.v*dt;if(p.y<0)p.y=1;x.beginPath();x.arc(p.x*W,p.y*H,p.r,0,7);x.fill()});
  x.shadowColor=col;x.shadowBlur=12;x.strokeStyle=col;x.fillStyle=col;x.globalAlpha=.85+.15*Math.sin(t*40)*Math.sin(t*3);
  ring(cx,cy,R*1.15,1.5,[40,14],.3*f);ring(cx,cy,R*.95,1,[3,9],-.25*f);ring(cx,cy,R*.75,3,[90,30],.5*f);ring(cx,cy,R*.5,1,[2,6],-.8*f);
  x.setLineDash([]);x.lineWidth=2;
  if(st==='boot'){x.beginPath();x.arc(cx,cy,7+3*Math.sin(t*3),0,7);x.fill();say&&($('msg').textContent||say('TAP TO INITIALIZE','CAMERA AND HAND TRACKING'))}
  const prog=st==='enroll'?samples.length/25:st==='face'?holdT:(st==='setg'||st==='hand')?gT/.9:0;
  if(prog>0){x.lineWidth=4;x.beginPath();x.arc(cx,cy,R*1.3,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(prog,1));x.stroke()}
  if(fr){x.globalAlpha=.8;for(let i=0;i<fr.length;i+=2){const p=map(fr[i]);x.fillRect(p[0],p[1],2,2)}}
  if(hr){x.globalAlpha=1;x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();HC.forEach(e=>{const a=map(hr[e[0]]),b=map(hr[e[1]]);x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1])});x.stroke();
    x.fillStyle=col;hr.forEach(l=>{const p=map(l);x.beginPath();x.arc(p[0],p[1],4,0,7);x.fill()})}
  if(ok){grantT+=dt;x.globalAlpha=Math.max(0,1-grantT/1.4);x.strokeStyle=col;x.lineWidth=4;x.beginPath();x.arc(cx,cy,grantT*W*.6,0,7);x.stroke();x.globalAlpha=1;
    x.lineWidth=5;x.beginPath();x.moveTo(cx-R*.2,cy);x.lineTo(cx-R*.05,cy+R*.15);x.lineTo(cx+R*.22,cy-R*.15);x.stroke()}
  x.shadowBlur=0;x.globalAlpha=1;
  if(flash>0){x.globalAlpha=flash*.18;x.fillStyle=flashCol;x.fillRect(0,0,W,H);x.globalAlpha=1;flash-=dt*1.5}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
